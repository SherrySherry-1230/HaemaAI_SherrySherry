<!doctype html>
<!-- @editedBy YAONG1230 2026-11-23 -->
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F7F3EA">
    <meta name="referrer" content="no-referrer">
    <title>해마.ai</title>
    <link rel="icon" href="Resources/favicon.svg" type="image/svg+xml">
    <style>
        @font-face {
            font-family: "CookieRun";
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url("Resources/haema-design/fonts/CookieRunWebRegular.woff") format("woff");
        }
        @font-face {
            font-family: "CookieRun";
            font-style: normal;
            font-weight: 900;
            font-display: swap;
            src: url("Resources/haema-design/fonts/CookieRunWebBlack.woff2") format("woff2");
        }
        * { box-sizing: border-box; }
        html { color-scheme: light; }
        body {
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
                     max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            background: #F7F3EA;
            color: #26292E;
            font-family: "CookieRun", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        }
        main {
            --haema-width: clamp(120px, 44vw, 180px);
            --bubble-width: clamp(142px, 39vw, 164px);
            --bubble-height: clamp(144px, 38vw, 156px);
            --belly-gap: 8px;
            --bubble-offset: calc(var(--haema-width) * 0.77 + var(--belly-gap));
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            width: min(100%, calc(var(--bubble-offset) + var(--bubble-width)));
        }
        .haema, .speech-bubble {
            grid-area: 1 / 1;
            align-self: start;
        }
        .haema {
            display: block;
            width: var(--haema-width);
            height: auto;
        }
        .speech-bubble {
            display: grid;
            align-content: center;
            min-height: var(--bubble-height);
            margin: 0;
            /* The tail lines up with the chin; the left edge follows the belly. */
            margin-block-start: calc(var(--haema-width) * 0.9);
            margin-inline-start: var(--bubble-offset);
            padding: 18px 10px 16px;
            border: 0 solid transparent;
            border-image: url("Resources/haema-design/mobile-notice-bubble.svg")
                52 94 52 96 fill / 26px 47px 26px 48px / 0 stretch;
            font-size: clamp(13px, 3.6vw, 15px);
            font-weight: 400;
            line-height: 1.55;
            text-align: center;
            word-break: keep-all;
        }
        .speech-bubble strong {
            margin-bottom: 4px;
            color: #8A3150;
            font-size: 1.35em;
            font-weight: 900;
        }
        @media (orientation: landscape) and (max-height: 500px) {
            body {
                padding-block: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-bottom));
            }
            main { --haema-width: min(144px, 35vh); }
        }
    </style>
</head>
<body>
    <main aria-label="해마.ai 이용 안내">
        <img class="haema" src="Resources/haema-design/crying-haema.png" alt="">
        <h1 class="speech-bubble">
            <strong>죄송해요!</strong>
            <span>아직, 해마.ai 테스트는</span>
            <span>PC나 맥에서만 가능해요.</span>
        </h1>
    </main>
</body>
</html>
