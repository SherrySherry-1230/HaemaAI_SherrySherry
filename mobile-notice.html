<!doctype html>
<!-- @editedBy YAONG1230 2026-11-23 -->
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F7F3EA">
    <meta name="referrer" content="no-referrer">
    <title>해마.ai</title>
    <link rel="icon" href="Resources/favicon.svg" type="image/svg+xml">
    <style>
        @font-face {
            font-family: "CookieRun";
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url("Resources/haema-design/fonts/CookieRunWebRegular.woff") format("woff");
        }
        @font-face {
            font-family: "CookieRun";
            font-style: normal;
            font-weight: 900;
            font-display: swap;
            src: url("Resources/haema-design/fonts/CookieRunWebBlack.woff2") format("woff2");
        }
        * { box-sizing: border-box; }
        html { color-scheme: light; }
        body {
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right))
                     max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
            background: #F7F3EA;
            color: #26292E;
            font-family: "CookieRun", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        }
        main {
            --haema-width: min(54%, 202px);
            display: grid;
            width: min(100%, 440px);
        }
        .haema, .speech-bubble {
            grid-area: 1 / 1;
            align-self: start;
        }
        .haema {
            display: block;
            width: var(--haema-width);
            height: auto;
        }
        .speech-bubble {
            display: grid;
            align-content: center;
            min-height: clamp(128px, 34vw, 152px);
            margin: 0;
            /* Anchor the vector's top-left tail just below Haema's chin. */
            margin-block-start: calc(var(--haema-width) * 0.9);
            margin-inline-start: calc(var(--haema-width) * 0.78);
            padding: 22px clamp(10px, 3.25vw, 16px) 20px;
            background: url("Resources/haema-design/mobile-notice-bubble.svg") center / 100% 100% no-repeat;
            font-size: clamp(14px, 4vw, 18px);
            font-weight: 400;
            line-height: 1.55;
            text-align: center;
            word-break: keep-all;
        }
        .speech-bubble strong {
            margin-bottom: 4px;
            color: #8A3150;
            font-size: 1.35em;
            font-weight: 900;
        }
        @media (orientation: landscape) and (max-height: 500px) {
            body {
                padding-block: max(14px, env(safe-area-inset-top)) max(14px, env(safe-area-inset-bottom));
            }
            main { --haema-width: min(54%, 155px, 39vh); }
            .speech-bubble {
                min-height: 128px;
                padding-block: 15px 13px;
            }
        }
    </style>
</head>
<body>
    <main aria-label="해마.ai 이용 안내">
        <img class="haema" src="Resources/haema-design/crying-haema.png" alt="">
        <h1 class="speech-bubble">
            <strong>죄송해요!</strong>
            <span>아직, 해마.ai 테스트는</span>
            <span>PC나 맥에서만 가능해요.</span>
        </h1>
    </main>
</body>
</html>
