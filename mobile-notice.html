<!doctype html>
<!-- @editedBy YAONG1230 2026-11-23 -->
<html lang="ko">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F7F3EA">
    <meta name="referrer" content="no-referrer">
    <title>해마.ai</title>
    <link rel="icon" href="Resources/favicon.svg" type="image/svg+xml">
    <style>
        @font-face {
            font-family: "CookieRun";
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: url("Resources/haema-design/fonts/CookieRunWebRegular.woff") format("woff");
        }
        @font-face {
            font-family: "CookieRun";
            font-style: normal;
            font-weight: 900;
            font-display: swap;
            src: url("Resources/haema-design/fonts/CookieRunWebBlack.woff2") format("woff2");
        }
        * { box-sizing: border-box; }
        html { color-scheme: light; }
        body {
            min-height: 100vh;
            min-height: 100svh;
            margin: 0;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            place-items: center;
            padding: max(12px, env(safe-area-inset-top)) env(safe-area-inset-right)
                     max(12px, env(safe-area-inset-bottom)) env(safe-area-inset-left);
            background: #F7F3EA;
            color: #26292E;
            font-family: "CookieRun", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
        }
        main {
            /* One unit in the 393px-wide mobile artwork. */
            --unit: calc(100cqi / 393);
            container-type: inline-size;
            display: grid;
            grid-template-columns: minmax(0, 1fr);
            width: min(100%, 410px);
        }
        .haema, .speech-bubble {
            grid-area: 1 / 1;
            place-self: start;
        }
        .haema {
            display: block;
            width: calc(172.91 * var(--unit));
            height: auto;
            margin-inline-start: calc(49.3 * var(--unit));
            /* The artwork sits slightly above the frame's vertical center. */
            margin-block-end: calc(10.55 * var(--unit));
        }
        .speech-bubble {
            width: calc(156 * var(--unit));
            min-height: calc(149.33 * var(--unit));
            margin: 0;
            margin-block-start: calc(141.98 * var(--unit));
            margin-inline-start: calc(198 * var(--unit));
            padding: calc(25 * var(--unit)) calc(10 * var(--unit))
                     calc(17 * var(--unit)) calc(8 * var(--unit));
            border: 0 solid transparent;
            border-image: url("Resources/haema-design/mobile-notice-bubble.svg")
                26 60 26.672 48 fill / calc(26 * var(--unit)) calc(60 * var(--unit))
                calc(26 * var(--unit)) calc(48 * var(--unit)) / 0 stretch;
            font-size: calc(14.15 * var(--unit));
            font-weight: 400;
            line-height: 1.55;
            text-align: center;
            word-break: keep-all;
        }
        .speech-bubble strong {
            display: block;
            width: calc(136 * var(--unit));
            margin-bottom: calc(4 * var(--unit));
            color: #8A3150;
            font-size: calc(19.1 * var(--unit));
            font-weight: 900;
            line-height: calc(29 * var(--unit));
        }
        @media (orientation: landscape) and (max-height: 500px) {
            main { width: min(100%, 410px, 115svh); }
        }
    </style>
</head>
<body>
    <main aria-label="해마.ai 이용 안내">
        <img class="haema" src="Resources/haema-design/crying-haema.png" alt="">
        <h1 class="speech-bubble">
            <strong>죄송해요!</strong>
            <span>아직, 해마.ai 테스트는<br>PC나 맥에서만<br>가능해요.</span>
        </h1>
    </main>
</body>
</html>
