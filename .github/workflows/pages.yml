              "web-console/haema-incremental-controller.js",
              "web-console/haema-introduction-modal.js",
              "web-console/haema-introduction.js",
              "web-console/haema-local-connection.css",
              "web-console/haema-local-connection.mjs",
              "web-console/haema-responsive-controls.css",
              "web-console/haema-seon.css",
              "web-console/haema-seon.js",
              "web-console/haema-storage-db.js",
              "web-console/haema-storage-modal.js",
              "web-console/haema-test-host.js",
              "web-console/haema-token-meter.js",
              "web-console/haema-token-usage.js",
              "web-console/haema-toolbar.css",
              "web-console/local-connection-client.mjs",
              "web-console/remembered-connection-store.mjs",
              "web-console/storage-downloads.mjs",
          )
          destination = Path("_site")
          destination.mkdir()
          for name in files:
              source = Path(name)
              if source.is_symlink() or not source.is_file():
                  raise SystemExit(f"Site asset is unavailable: {name}")
              target = destination / source
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, target)
          (destination / ".nojekyll").touch()
      - name: Upload site
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v5
